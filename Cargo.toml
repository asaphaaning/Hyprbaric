# This file is used for telling Rust-related tools
# where various Rust crates are.
# This also unifies `target` output folder and
# various Rust configurations.

[workspace]
resolver = "3"
members = ["native/*"]

[workspace.lints.clippy]
# Existing hard guardrails.
expect_used = "deny"
unwrap_used = "deny"
wildcard_imports = "deny"

# Panic and placeholder tripwires.
get_unwrap = "warn"
panic = "warn"
panic_in_result_fn = "warn"
todo = "warn"
unchecked_time_subtraction = "warn"
unimplemented = "warn"
unreachable = "warn"
unwrap_in_result = "warn"

# Dropped work and swallowed errors.
assertions_on_result_states = "warn"
let_underscore_future = "warn"
let_underscore_must_use = "warn"
map_err_ignore = "warn"
unused_result_ok = "warn"

# Async and concurrency hazards.
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
if_let_mutex = "warn"
large_futures = "warn"
rc_mutex = "warn"

# Unsafe and memory hygiene.
mem_forget = "warn"
multiple_unsafe_ops_per_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"

# Numeric correctness.
float_cmp = "warn"
float_cmp_const = "warn"
invalid_upcast_comparisons = "warn"
lossy_float_literal = "warn"

# Maintainability and review hygiene.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
debug_assert_with_mut_call = "warn"
dbg_macro = "warn"
enum_glob_use = "warn"
expl_impl_clone_on_copy = "warn"
infallible_try_from = "warn"
iter_not_returning_iterator = "warn"
macro_use_imports = "warn"
match_wildcard_for_single_variants = "warn"
redundant_clone = "warn"
